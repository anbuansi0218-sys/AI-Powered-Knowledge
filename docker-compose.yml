services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5001}
      MSSQL_SERVER: ${MSSQL_SERVER:-host.docker.internal}
      MSSQL_INSTANCE: ${MSSQL_INSTANCE:-}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-AI-assistant}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-}
      MSSQL_ENCRYPT: ${MSSQL_ENCRYPT:-false}
      MSSQL_TRUST_SERVER_CERTIFICATE: ${MSSQL_TRUST_SERVER_CERTIFICATE:-true}
      HF_TOKEN: ${HF_TOKEN:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      HF_INFERENCE_BASE_URL: ${HF_INFERENCE_BASE_URL:-https://router.huggingface.co/v1}
      HF_CHAT_MODEL: ${HF_CHAT_MODEL:-Qwen/Qwen3-8B:featherless-ai}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      HF_EMBEDDING_MODEL: ${HF_EMBEDDING_MODEL:-Xenova/all-MiniLM-L6-v2}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - document_uploads:/workspace/backend/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5001}:80"

volumes:
  document_uploads:
